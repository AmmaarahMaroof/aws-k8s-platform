name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Run tests
        run: pytest

  build-and-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t uptime-monitor:${{ github.sha }} .

      - name: Scan image for critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed \
            uptime-monitor:${{ github.sha }}
    
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10"

      - name: Terraform format check
        run: terraform fmt -check -recursive infra

      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      - name: Validate dev environment
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false
          terraform validate
          
      - name: Validate prod environment
        working-directory: infra/envs/prod
        run: |
          terraform init -backend=false
          terraform validate

  terraform-plan:
    runs-on: ubuntu-latest
    needs: terraform
    
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Sign in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::099021515478:role/github-actions-terraform-plan
          aws-region: eu-west-2

      - name: Check who we are
        run: aws sts get-caller-identity

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10"

      - name: Terraform plan (dev)
        working-directory: infra/envs/dev
        env:
          TF_VAR_http_allowed_cidr: ${{ secrets.HTTP_ALLOWED_CIDR }}
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint helm/uptime-monitor
      - name: Render templates
        run: helm template uptime helm/uptime-monitor > /dev/null