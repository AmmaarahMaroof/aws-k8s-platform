services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: uptime
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime"]
      interval: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://uptime:localdevpassword@db:5432/uptime
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
