# A stable network name ("db") so the app can find the database
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: uptime
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: uptime
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-bookworm
          ports:
            - containerPort: 5432
          # Username, password and database name come from the Secret
          envFrom:
            - secretRef:
                name: db-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          # Kubernetes only sends traffic once the database accepts connections
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "uptime"]
            initialDelaySeconds: 5
            periodSeconds: 5
  # Storage that survives the pod being deleted or restarted
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi