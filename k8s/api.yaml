apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: uptime
spec:
  selector:
    app: api              # must match the pod label below
  ports:
    - port: 80            # what other things call
      targetPort: 8000     # the port uvicorn listens on (see Dockerfile)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: uptime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: uptime-monitor:dev                   # the tag you just built
          imagePullPolicy: IfNotPresent # use the local image, don't try a registry
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: app-config               # the secret from step 2
          readinessProbe:
            httpGet:
              path: /ready              # the endpoint that checks the DB
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health                 # the endpoint that does NOT touch the DB
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}