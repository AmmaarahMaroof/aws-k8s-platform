apiVersion: batch/v1
kind: CronJob
metadata:
  name: checker
  namespace: uptime
spec:
  schedule: "*/5 * * * *"                 # every 5 minutes, in cron syntax
  concurrencyPolicy: Forbid       # don't start a new run if the last one is still going
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2             # retry a failed run twice, then give up
      template:
        spec:
          restartPolicy: OnFailure      # OnFailure or Never. Which fits a run-once job?
          containers:
            - name: checker
              image: uptime-monitor:dev          # same image as the API
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "app.checker"]   # the module that runs one round of checks
              envFrom:
                - secretRef:
                    name: app-config
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {memory: 128Mi}