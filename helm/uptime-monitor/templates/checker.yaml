apiVersion: batch/v1
kind: CronJob
metadata:
  name: checker
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.checker.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: checker
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "app.checker"]
              envFrom:
                - secretRef:
                    name: {{ .Values.appConfigSecret }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi