# Settings for the whole chart. Override any of these at install time
# with --set key=value or -f my-values.yaml

image:
  repository: uptime-monitor
  tag: dev
  pullPolicy: IfNotPresent

# Secrets are NOT created by this chart, so no credentials live in Git.
# They must already exist in the namespace (created via kubectl).
appConfigSecret: app-config

api:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

checker:
  schedule: "*/5 * * * *"

postgres:
  image: postgres:16-bookworm
  credentialsSecret: db-credentials
  storage: 1Gi


# Credentials for pulling images from a private registry (empty locally)
imagePullSecrets: []

# Expose the API over HTTP via an Ingress (off locally; on in AWS)
ingress:
  enabled: false
  className: traefik

# Prometheus scraping. Needs the Prometheus Operator (kube-prometheus-stack),
# so it's off by default and turned on where that's installed.
monitoring:
  enabled: false


# Nightly database backup to S3 (needs AWS credentials, so it's off by default
# and turned on in values-aws.yaml)
backup:
  enabled: false
  schedule: "0 2 * * *"          # every day at 02:00 (cron: minute hour day month weekday)
  bucket: ""
  region: eu-west-2
  awsCliImage: amazon/aws-cli:latest   # pin to a specific version once tested

